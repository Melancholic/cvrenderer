services:
  cvrenderer:
    build:
      context: .
      args:
        TYPST_VERSION: "0.12.0"
    image: cvrenderer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Your CV data. Each ./data/<name>.yaml (or .yml) is served at
      # GET /cv/<name>.pdf (e.g. ./data/cv-example.yaml ->
      # /cv/cv-example.pdf), and DEFAULT_CV also answers at /cv.pdf.
      # Typst reads under ROOT=/app, so the directory must be mounted
      # at /app/data.
      - ./data:/app/data:ro
    environment:
      PORT: "8080"
      RENDER_TIMEOUT: "30s"
      # The CV behind /cv.pdf, and the layout used without ?template=.
      DEFAULT_CV: "cv-default"
      DEFAULT_TEMPLATE: "helsinki"
      # Prints the served URLs at startup (docker compose logs). Behind
      # nginx-proxy set VIRTUAL_HOST to the public name; LETSENCRYPT_HOST
      # (acme-companion) is what switches those URLs to https.
      VIRTUAL_HOST: "localhost:8080"
      # Download filename: <prefix><YYYYMMDDHHMM>.pdf
      OUT_FILE_PREFIX: "resume-"
